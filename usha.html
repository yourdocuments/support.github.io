<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="USHA AI Learning Mentor - SNK IT Institute"
  >

  <title>USHA AI Mentor — SNK IT Institute</title>

  <link rel="stylesheet" href="usha.css">
</head>

<body>

  <!-- =====================================================
       USHA APP
       ===================================================== -->

  <main class="usha-app">

    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="usha-header">

      <div class="usha-brand">

        <div class="usha-logo">
          <img
            src="https://github.com/yourdocuments/products/blob/main/ushaicon.svg?raw=true"
            alt="USHA"
          >
        </div>

        <div class="usha-brand-text">
          <h1>usha.ai</h1>
          <p>Your AI Learning Mentor</p>
        </div>

      </div>

      <div class="usha-header-right">

        <div class="usha-status">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>

        <button
          class="header-support"
          type="button"
          onclick="showSupportMessage()"
        >
          Support
        </button>

      </div>

    </header>


    <!-- ===================================================
         MAIN CHAT AREA
         =================================================== -->

    <section class="usha-main">

      <!-- ================================================
           WELCOME SCREEN
           ================================================ -->

      <div
        id="ushaWelcome"
        class="usha-welcome"
      >

        <div class="welcome-avatar">

          <img
            src="https://github.com/yourdocuments/products/blob/main/ushaicon.svg?raw=true"
            alt="USHA AI"
          >

          <span class="welcome-online"></span>

        </div>

        <div class="welcome-badge">
          ✨ AI Learning Mentor
        </div>

        <h2>
          Hi, I'm <span>USHA</span> 👋
        </h2>

        <p>
          তোমার learning journey শুরু করি।
          <br>
          Course, coding, website বা learning নিয়ে আমাকে যেকোনো প্রশ্ন করতে পারো।
        </p>

      </div>


      <!-- ================================================
           SUGGESTION CARDS
           ================================================ -->

      <div
        id="ushaSuggestions"
        class="usha-suggestions"
      >

        <button
          class="suggestion-card"
          type="button"
          data-question="আমি কী কী শিখতে পারি?"
        >

          <span class="suggestion-icon">🎓</span>

          <span class="suggestion-content">
            <strong>Learning</strong>
            <small>আমি কী কী শিখতে পারি?</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>


        <button
          class="suggestion-card"
          type="button"
          data-question="আমি HTML শিখতে চাই, কোথা থেকে শুরু করব?"
        >

          <span class="suggestion-icon">💻</span>

          <span class="suggestion-content">
            <strong>Learn Coding</strong>
            <small>HTML কোথা থেকে শুরু করব?</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>


        <button
          class="suggestion-card"
          type="button"
          data-question="Free course সম্পর্কে বলো"
        >

          <span class="suggestion-icon">📚</span>

          <span class="suggestion-content">
            <strong>Free Courses</strong>
            <small>Free course সম্পর্কে জানি</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>


        <button
          class="suggestion-card"
          type="button"
          data-question="Live class কীভাবে join করব?"
        >

          <span class="suggestion-icon">🔴</span>

          <span class="suggestion-content">
            <strong>Live Class</strong>
            <small>কীভাবে live class join করব?</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>


        <button
          class="suggestion-card"
          type="button"
          data-question="তুমি কে?"
        >

          <span class="suggestion-icon">🤖</span>

          <span class="suggestion-content">
            <strong>About USHA</strong>
            <small>USHA সম্পর্কে জানি</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>


        <button
          class="suggestion-card"
          type="button"
          data-question="SNK কে?"
        >

          <span class="suggestion-icon">❤️</span>

          <span class="suggestion-content">
            <strong>About SNK</strong>
            <small>SNK সম্পর্কে জানতে চাই</small>
          </span>

          <span class="suggestion-arrow">→</span>

        </button>

      </div>


      <!-- ================================================
           CHAT MESSAGES
           ================================================ -->

      <div
        id="ushaMessages"
        class="usha-messages"
        aria-live="polite"
      ></div>

    </section>


    <!-- ===================================================
         INPUT AREA
         =================================================== -->

    <footer class="usha-footer">

      <div class="input-wrapper">

        <textarea
          id="ushaInput"
          class="usha-input"
          rows="1"
          placeholder="Ask USHA anything..."
          autocomplete="off"
        ></textarea>

        <button
          id="ushaSend"
          class="usha-send"
          type="button"
          aria-label="Send message"
        >
          <span>➤</span>
        </button>

      </div>

      <div class="footer-info">
        <span>USHA can make mistakes. Check important information.</span>

        <button
          id="ushaClear"
          class="clear-chat"
          type="button"
        >
          Clear chat
        </button>
      </div>

    </footer>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="usha.js"></script>

</body>
</html>
