<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>USHA AI — Your AI Learning Mentor</title>

  <meta
    name="description"
    content="USHA — SNK IT Institute AI Learning Mentor"
  >

  <link rel="stylesheet" href="usha.css">
</head>

<body>

  <div class="usha-app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="usha-header">

      <div class="usha-brand">

        <img
          class="usha-brand-icon"
          src="https://github.com/yourdocuments/products/blob/main/ushaicon.svg?raw=true"
          alt="USHA"
        >

        <div class="usha-brand-text">

          <div class="usha-brand-name">
            usha.ai
          </div>

          <div class="usha-brand-subtitle">
            Your AI Learning Mentor
          </div>

        </div>

      </div>


      <div class="usha-header-right">

        <div class="usha-online">

          <span class="usha-online-dot"></span>

          <span>
            Online
          </span>

        </div>


        <button
          type="button"
          class="usha-support-btn"
          onclick="showSupportMessage()"
        >
          Support
        </button>

      </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="usha-main">


      <!-- ===================================================
           WELCOME
      ==================================================== -->

      <section
        id="ushaWelcome"
        class="usha-welcome"
      >

        <img
          class="usha-welcome-icon"
          src="https://github.com/yourdocuments/products/blob/main/ushaicon.svg?raw=true"
          alt="USHA AI"
        >


        <div class="usha-welcome-badge">
          ✨ AI Learning Mentor
        </div>


        <h1>
          Hi, I'm USHA 👋
        </h1>


        <p>
          তোমার শেখার journey-তে আমি তোমার AI learning mentor।
          তুমি কী শিখতে চাও বলো, আমরা একসাথে শুরু করি।
        </p>

      </section>


      <!-- ===================================================
           SMART LEARNING MENU
      ==================================================== -->

      <section
        id="ushaSuggestions"
        class="usha-suggestions"
      >

        <!-- Free Course -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="আমি কী কী Free Course শিখতে পারি?"
        >

          <span class="usha-suggestion-icon">
            🎓
          </span>

          <span class="usha-suggestion-title">
            Free Course
          </span>

        </button>


        <!-- Coding -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="আমি coding শিখতে চাই, কোথা থেকে শুরু করব?"
        >

          <span class="usha-suggestion-icon">
            💻
          </span>

          <span class="usha-suggestion-title">
            Coding শিখতে চাই
          </span>

        </button>


        <!-- HTML -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="আমি HTML শিখতে চাই, কোথা থেকে শুরু করব?"
        >

          <span class="usha-suggestion-icon">
            🌐
          </span>

          <span class="usha-suggestion-title">
            HTML শেখা শুরু
          </span>

        </button>


        <!-- Live -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="Live class কীভাবে join করব?"
        >

          <span class="usha-suggestion-icon">
            🔴
          </span>

          <span class="usha-suggestion-title">
            Live Class
          </span>

        </button>


        <!-- Recorded -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="Recorded class কোথায় পাব?"
        >

          <span class="usha-suggestion-icon">
            📚
          </span>

          <span class="usha-suggestion-title">
            Recorded Classes
          </span>

        </button>


        <!-- SNK -->

        <button
          type="button"
          class="usha-suggestion"
          data-question="SNK IT Institute সম্পর্কে বলো"
        >

          <span class="usha-suggestion-icon">
            ❤️
          </span>

          <span class="usha-suggestion-title">
            About SNK
          </span>

        </button>

      </section>


      <!-- ===================================================
           CHAT MESSAGES
      ==================================================== -->

      <section
        id="ushaMessages"
        class="usha-messages"
        aria-live="polite"
        aria-label="USHA Chat Messages"
      >

        <!--
          Messages will be added here
          by usha.js
        -->

      </section>

    </main>


    <!-- =====================================================
         FOOTER / INPUT
    ====================================================== -->

    <footer class="usha-footer">

      <div class="usha-input-container">

        <div class="usha-input-wrap">

          <textarea
            id="ushaInput"
            rows="1"
            maxlength="1000"
            placeholder="Ask USHA anything..."
            autocomplete="off"
            spellcheck="true"
          ></textarea>


          <button
            type="button"
            id="ushaSend"
            aria-label="Send message"
            title="Send"
          >
            ➤
          </button>

        </div>


        <div class="usha-clear">

          <button
            type="button"
            id="ushaClear"
          >
            Clear chat
          </button>

        </div>


        <div class="usha-footer-note">
          USHA AI Mentor • SNK IT Institute
        </div>

      </div>

    </footer>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
      id="ushaToast"
      class="usha-toast"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!-- =======================================================
       SCRIPT
  ======================================================== -->

  <script src="usha.js"></script>

</body>
</html>
